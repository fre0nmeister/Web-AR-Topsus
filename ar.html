<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Rumah Adat</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    .back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      background: white;
      color: black;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <a href="index.html" class="back-button">
    ← Kembali
  </a>

  <a-scene mindar-image="imageTargetSrc: targets.mind;" color-space="sRGB" embedded vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false" renderer="colorManagement: true, physicallyCorrectLights">

    <!-- Camera -->
    <a-camera position="0 0 0" look-controls="enabled: false">
    </a-camera>

    <!-- ================================= -->
    <!-- Rumah Gadang -->
    <!-- ================================= -->

    <a-entity mindar-image-target="targetIndex: 0">

      <a-gltf-model src="models/gadang.glb" position="0 0 0" rotation="0 0 0" scale="0.3 0.3 0.3">
      </a-gltf-model>

    </a-entity>

    <!-- ================================= -->
    <!-- Rumah Joglo -->
    <!-- ================================= -->

    <a-entity mindar-image-target="targetIndex: 1">

      <a-gltf-model src="models/joglo.glb" position="0 0 0" rotation="0 0 0" scale="0.3 0.3 0.3">
      </a-gltf-model>

    </a-entity>

    <!-- ================================= -->
    <!-- Rumah Tongkonan -->
    <!-- ================================= -->

    <a-entity mindar-image-target="targetIndex: 2">

      <a-gltf-model src="models/tongkonan.glb" position="0 0 0" rotation="0 0 0" scale="0.3 0.3 0.3">
      </a-gltf-model>

    </a-entity>

    <!-- ================================= -->
    <!-- Rumah Honai -->
    <!-- ================================= -->

    <a-entity mindar-image-target="targetIndex: 3">

      <a-gltf-model src="models/honai.glb" position="0 0 0" rotation="0 0 0" scale="0.3 0.3 0.3">
      </a-gltf-model>

    </a-entity>

    <!-- ================================= -->
    <!-- Rumah Bolon -->
    <!-- ================================= -->

    <a-entity mindar-image-target="targetIndex: 4">

      <a-gltf-model src="models/bolon.glb" position="0 0 0" rotation="0 0 0" scale="0.3 0.3 0.3">
      </a-gltf-model>

    </a-entity>

  </a-scene>

</body>

</html>
